name: build-thefcraft-metadata-ledger

on:
  push:
    paths:
      - .github/workflows/build-thefcraft-metadata-ledger.yml
      - civitai-indexer/src/civitai_indexer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'civitai-indexer[parquet]'
      - name: Download, import, and remove metadata partitions
        env:
          DATASET: https://huggingface.co/datasets/thefcraft/civitai-stable-diffusion-337k
        run: |
          set -euo pipefail
          for part in 0000 0001; do
            file="$RUNNER_TEMP/thefcraft-$part.parquet"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$DATASET/resolve/refs%2Fconvert%2Fparquet/default/train/$part.parquet" \
              --output "$file"
            python -m civitai_indexer --db civitai-indexer/data/thefcraft-civitai.sqlite \
              import-parquet "$file" \
              --source thefcraft-civitai-stable-diffusion-337k --kind dataset \
              --location "$DATASET" --license-note Apache-2.0
            rm -f "$file"
          done
      - name: Measure coverage
        run: >-
          python -m civitai_indexer --db civitai-indexer/data/thefcraft-civitai.sqlite coverage
          > civitai-indexer/data/thefcraft-civitai-coverage.json
      - name: Publish metadata ledger
        uses: actions/upload-artifact@v4
        with:
          name: thefcraft-civitai-metadata-ledger
          path: |
            civitai-indexer/data/thefcraft-civitai.sqlite
            civitai-indexer/data/thefcraft-civitai-coverage.json
          if-no-files-found: error
          retention-days: 7
