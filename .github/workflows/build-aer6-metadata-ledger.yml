name: build-aer6-metadata-ledger

on:
  push:
    paths:
      - .github/workflows/build-aer6-metadata-ledger.yml
      - civitai-indexer/src/civitai_indexer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e civitai-indexer
      - name: Download metadata JSONL only
        run: >-
          curl --fail --location --retry 3 --retry-delay 2
          'https://huggingface.co/datasets/AER6/civitai-multimodal-rag-data/resolve/main/data/meta.jsonl?download=true'
          --output "$RUNNER_TEMP/aer6-meta.jsonl"
      - name: Import SFW metadata ledger
        run: >-
          python -m civitai_indexer --db civitai-indexer/data/aer6-civitai.sqlite
          import-images "$RUNNER_TEMP/aer6-meta.jsonl"
          --source aer6-civitai-multimodal-rag --kind dataset
          --location https://huggingface.co/datasets/AER6/civitai-multimodal-rag-data
      - name: Remove downloaded metadata source
        run: rm -f "$RUNNER_TEMP/aer6-meta.jsonl"
      - name: Measure coverage
        run: >-
          python -m civitai_indexer --db civitai-indexer/data/aer6-civitai.sqlite coverage
          > civitai-indexer/data/aer6-civitai-coverage.json
      - name: Publish SFW metadata ledger
        uses: actions/upload-artifact@v4
        with:
          name: aer6-civitai-metadata-ledger
          path: |
            civitai-indexer/data/aer6-civitai.sqlite
            civitai-indexer/data/aer6-civitai-coverage.json
          if-no-files-found: error
          retention-days: 7
