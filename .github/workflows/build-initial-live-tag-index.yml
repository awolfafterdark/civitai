name: build-initial-live-tag-index

on:
  push:
    paths:
      - .github/workflows/build-initial-live-tag-index.yml
      - civitai-indexer/src/civitai_indexer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-tag-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e civitai-indexer
      - name: Collect one validated image.getInfinite page
        run: >-
          python -m civitai_indexer
          --db civitai-indexer/data/initial-live-tags.sqlite
          sync-trpc --pages 1 --delay 0 --checkpoint initial-live-tags
      - name: Measure verified tag coverage
        run: >-
          python -m civitai_indexer
          --db civitai-indexer/data/initial-live-tags.sqlite coverage
          > civitai-indexer/data/initial-live-tags-coverage.json
      - name: Publish initial tag-relation database
        uses: actions/upload-artifact@v4
        with:
          name: initial-live-tag-index
          path: |
            civitai-indexer/data/initial-live-tags.sqlite
            civitai-indexer/data/initial-live-tags-coverage.json
          if-no-files-found: error
          retention-days: 7
