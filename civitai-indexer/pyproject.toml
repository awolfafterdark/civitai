[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civitai-indexer"
version = "0.1.0"
description = "Media-free, provenance-aware local Civitai image and tag index"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
civitai-index = "civitai_indexer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
